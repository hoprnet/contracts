[advisories]
ignore = [
  "RUSTSEC-2024-0436", # 'paste' 1.0.15 via 'alloy-primitives'/'syn-solidity' 1.6.1 and 'ark-ff' 0.3-0.5 [unmaintained]; remove when those drop it
  "RUSTSEC-2024-0388", # 'derivative' 2.2.0 via 'ark-ff' 0.3/0.4 (pulled by 'ruint' 1.20.0) [unmaintained]; remove when 'ruint' stops pulling the old 'ark-ff'
  "RUSTSEC-2026-0387", # 'crypto-bigint' 0.5.5 via 'alloy' 2.5.0 -> 'k256' 0.13 -> 'elliptic-curve' 0.13; patched 0.7.6 needs 'elliptic-curve' 0.14, so remove when 'alloy' moves that chain
]
informational_warnings = ["unmaintained"]
severity_threshold = "low"

[database]
path = "~/.cargo/advisory-db"
url = "https://github.com/RustSec/advisory-db.git"
fetch = true
stale = false

[output]
deny = ["warnings"]
format = "terminal" # "terminal" (human readable report) or "json"
quiet = false       # Only print information on error
show_tree = true    # Show inverse dependency trees along with advisories (default: true)

[target]
arch = [
  "x86_64",
  "aarch64",
] # Ignore advisories for CPU architectures other than these
os = [
  "linux",
  "windows",
  "macos",
] # Ignore advisories for operating systems other than these

[yanked]
enabled = true      # Warn for yanked crates in Cargo.lock (default: true)
update_index = true # Auto-update the crates.io index (default: true)
