#################################################################################
# Manual pipeline to clean the cache of a given pull request
#################################################################################
name: Cleanup PR
on:
  workflow_dispatch:
    inputs:
      pr_number:
        type: number
        required: true
        description: "Pull request number"
jobs:
  cleanup-pr:
    permissions:
      actions: write
      contents: read
      id-token: write
    name: Remove cache
    runs-on: depot-ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          disable-sudo: true
          egress-policy: block
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: main
      - name: Setup GCP
        id: gcp
        uses: hoprnet/hopr-workflows/actions/setup-gcp@fd29bf3c58b72faacc300e068a05b59eb3b180bc # 0.10.1
        with:
          login_artifact_registry: 'true'
          install_sdk: 'true'
      - name: Cleanup Github pipeline cache
        env:
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.inputs.pr_number }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mapfile -t cacheKeysForPR < <(gh actions-cache list -R "$REPO" -B "refs/pull/$PR_NUMBER/merge" | cut -f 1)
          for cacheKey in "${cacheKeysForPR[@]}"
          do
            gh actions-cache delete "$cacheKey" -R "$REPO" -B "refs/pull/$PR_NUMBER/merge" --confirm
          done
