name: PR
on:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review
permissions: {}
concurrency:
  group: ${{ github.event.pull_request.number || github.ref }}-pr
  cancel-in-progress: true
jobs:
  validate-pr-title:
    name: Validate title
    if: github.event_name == 'pull_request'
    runs-on: depot-ubuntu-24.04
    permissions:
      pull-requests: read
    steps:
      - uses: amannn/action-semantic-pull-request@48f256284bd46cdaab1048c3721360e808335d50 # v6.1.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          types: |
            fix
            feat
            build
            chore
            docs
            style
            refactor
            perf
            test
            ci
            revert
          requireScope: false
          ignoreLabels: |
            bot
            ignore-semantic-pull-request
  label:
    name: Add labels
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    # Fork PRs get a read-only token and cannot write labels; stay green so the gate passes.
    continue-on-error: true
    runs-on: depot-ubuntu-24.04
    permissions:
      contents: read
      issues: write
      pull-requests: write
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          disable-sudo: true
          egress-policy: audit
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/labeler@77a4082b841706ac431479b7e2bb11216ffef250 # main on 20.02.2025
        with:
          sync-labels: true
      - name: Add "external" label for forked PRs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BASE_REPO: ${{ github.repository }}
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          if [[ "$HEAD_REPO" != "$BASE_REPO" ]]; then
            gh pr edit "$PR_NUMBER" --add-label "external"
          fi
  # Gate jobs through inputs on the reusable workflows where possible: an
  # input-skipped inner job still reports its check name. Stages: 1 = checks,
  # 2 = tests, 3 = builds. A later stage runs only if the earlier one did not
  # fail (`!failure()` still lets a legitimately skipped stage through).
  changes:
    name: Detect changes
    runs-on: depot-ubuntu-24.04
    permissions:
      contents: read
      pull-requests: read
    outputs:
      rust: ${{ github.event_name != 'pull_request' || steps.filter.outputs.rust == 'true' }}
      lockfile: ${{ github.event_name != 'pull_request' || steps.filter.outputs.lockfile == 'true' }}
    steps:
      - name: Filter changed paths
        id: filter
        if: github.event_name == 'pull_request'
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        with:
          filters: |
            rust:
              - "ethereum/**"
              - "vendor/**"
              - "Cargo.toml"
              - "Cargo.lock"
              - "rust-toolchain.toml"
              - "rustfmt.toml"
              - ".cargo/**"
              - "flake.nix"
              - "flake.lock"
              - "nix/**"
              - "Makefile"
              - "justfile"
              - ".github/workflows/**"
              - ".github/scripts/**"
            lockfile:
              - "Cargo.toml"
              - "**/Cargo.toml"
              - "Cargo.lock"
              - ".cargo/audit.toml"
  checks:
    name: Check
    needs: changes
    permissions:
      contents: read
    uses: hoprnet/hopr-workflows/.github/workflows/checks.yaml@43c833e72dffe4f2f3be60193733e5657f8aa0d7 # workflow-checks-v3.0.0
    with:
      repo_sha: ${{ github.event.pull_request.head.sha || github.sha }}
      runner_small: depot-ubuntu-24.04
      runner_large: depot-ubuntu-24.04-4
      deps: false
      # Format and pre-commit cover every file type and always run.
      lint: ${{ needs.changes.outputs.rust == 'true' }}
      audit: ${{ needs.changes.outputs.lockfile == 'true' }}
    secrets:
      cachix_auth_token: ${{ secrets.CACHIX_AUTH_TOKEN }}
  tests:
    name: Test
    needs: [changes, checks]
    if: ${{ !cancelled() && !failure() }}
    permissions:
      contents: read
      id-token: write # Codecov OIDC upload in the coverage job
    uses: hoprnet/hopr-workflows/.github/workflows/tests.yaml@43c833e72dffe4f2f3be60193733e5657f8aa0d7 # workflow-tests-v7.0.0
    with:
      repo_sha: ${{ github.event.pull_request.head.sha || github.sha }}
      enable_unit_tests: ${{ needs.changes.outputs.rust == 'true' }}
      unit_test_command: "nix build -L .#test"
      enable_nightly_tests: ${{ needs.changes.outputs.rust == 'true' }}
      nightly_test_command: "nix build -L .#test-nightly"
      enable_unit_coverage: ${{ needs.changes.outputs.rust == 'true' }}
      unit_coverage_command: "nix run .#coverage-unit"
      runner_unit: depot-ubuntu-24.04-4
      test_timeout: 60
    secrets:
      cachix_auth_token: ${{ secrets.CACHIX_AUTH_TOKEN }}
  tests-smart-contracts:
    name: Smart Contracts
    runs-on: depot-ubuntu-24.04-4
    timeout-minutes: 60
    needs: [changes, checks]
    if: ${{ !cancelled() && !failure() && github.event.pull_request.draft == false && needs.changes.outputs.rust == 'true' }}
    permissions:
      contents: read
    env:
      FOUNDRY_PROFILE: ci
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          disable-sudo: true
          egress-policy: audit
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name || github.repository }}
          ref: ${{ github.event.pull_request.head.ref || github.ref }}
          persist-credentials: false
      - name: Setup Nix
        uses: hoprnet/hopr-workflows/actions/setup-nix@061b4579c870b0fdc008f5ff07a3a500e4fede50 # setup-nix-v2.2.2
        with:
          cachix_cache_name: contracts
          cachix_auth_token: "${{ secrets.CACHIX_AUTH_TOKEN }}"
      - name: Run tests
        env:
          HOPR_NETWORK: anvil-localhost
        run: nix develop -L -c make -j smart-contract-test
  build-library:
    name: Library ${{ matrix.architecture }}
    needs: [changes, checks, tests, tests-smart-contracts]
    if: ${{ !cancelled() && !failure() }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - architecture: x86_64-linux
            runner: depot-ubuntu-24.04-4
            required_label: ""
          - architecture: aarch64-linux
            runner: depot-ubuntu-24.04-arm-4
            required_label: "binary:aarch64-linux"
          - architecture: aarch64-darwin
            runner: depot-macos-15
            required_label: "binary:aarch64-darwin"
    uses: hoprnet/hopr-workflows/.github/workflows/build-library.yaml@43c833e72dffe4f2f3be60193733e5657f8aa0d7 # build-library-v4.0.0
    permissions:
      contents: read
      id-token: write # OIDC publish in build-library
    with:
      repo_sha: ${{ github.event.pull_request.head.sha || github.sha }}
      version_type: commit
      architecture: ${{ matrix.architecture }}
      cachix_cache_name: contracts
      package_name: hopr-bindings
      runner: ${{ matrix.runner }}
      enabled: ${{ needs.changes.outputs.rust == 'true' && (matrix.required_label == '' || contains(github.event.pull_request.labels.*.name, matrix.required_label)) }}
    secrets:
      cachix_auth_token: ${{ secrets.CACHIX_AUTH_TOKEN }}
  # Single aggregate merge gate: green only if every other job in this run
  # succeeded. Mark THIS one as the required check in the branch ruleset, so
  # adding, renaming, or removing a job never needs a ruleset change.
  # `if: always()` runs it even when a dependency fails; alls-green then reds
  # the gate on any non-success (a failed job, or a skip that is not allowed).
  merge-gate:
    name: Merge gate
    if: always()
    needs:
      - validate-pr-title
      - label
      - changes
      - checks
      - tests
      - tests-smart-contracts
      - build-library
    runs-on: depot-ubuntu-24.04
    permissions: {}
    steps:
      - name: Require all jobs to pass
        uses: re-actors/alls-green@b5b5b37504aa4183270bd3d855c52a67f212be35 # v1.3.0
        with:
          jobs: ${{ toJSON(needs) }}
          # validate-pr-title and label run on pull_request events only. They
          # skip on any other trigger (for example, a future merge_group run).
          # tests-smart-contracts skips only while the PR is a draft; marking
          # it ready triggers a new run that must run it. tests,
          # tests-smart-contracts and build-library may also skip when the
          # path filter finds no code change. Otherwise they must not skip.
          # A failed job reds the gate either way, and a stage skipped
          # because an earlier stage failed is covered by that failure.
          allowed-skips: ${{ needs.changes.outputs.rust != 'true' && 'validate-pr-title, label, tests, tests-smart-contracts, build-library' || github.event.pull_request.draft && 'validate-pr-title, label, tests-smart-contracts' || 'validate-pr-title, label' }}
